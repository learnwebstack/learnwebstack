<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Background card -->
  <rect x="10" y="10" width="780" height="480" rx="16" ry="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">DOM Tree Structure</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#64748b">The Document Object Model is a tree of nodes</text>

  <!-- Connectors (drawn first so nodes overlay) -->
  <!-- document → html -->
  <line x1="400" y1="125" x2="400" y2="158" stroke="#64748b" stroke-width="2"/>
  <!-- html → head, body -->
  <line x1="400" y1="195" x2="400" y2="215" stroke="#64748b" stroke-width="2"/>
  <line x1="220" y1="215" x2="580" y2="215" stroke="#64748b" stroke-width="2"/>
  <line x1="220" y1="215" x2="220" y2="245" stroke="#64748b" stroke-width="2"/>
  <line x1="580" y1="215" x2="580" y2="245" stroke="#64748b" stroke-width="2"/>

  <!-- head → title, meta -->
  <line x1="220" y1="285" x2="220" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="140" y1="310" x2="300" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="140" y1="310" x2="140" y2="340" stroke="#64748b" stroke-width="2"/>
  <line x1="300" y1="310" x2="300" y2="340" stroke="#64748b" stroke-width="2"/>

  <!-- body → h1, p, div -->
  <line x1="580" y1="285" x2="580" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="460" y1="310" x2="700" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="460" y1="310" x2="460" y2="340" stroke="#64748b" stroke-width="2"/>
  <line x1="580" y1="310" x2="580" y2="340" stroke="#64748b" stroke-width="2"/>
  <line x1="700" y1="310" x2="700" y2="340" stroke="#64748b" stroke-width="2"/>

  <!-- div → p, img -->
  <line x1="700" y1="378" x2="700" y2="405" stroke="#64748b" stroke-width="2"/>
  <line x1="640" y1="405" x2="745" y2="405" stroke="#64748b" stroke-width="2"/>
  <line x1="640" y1="405" x2="640" y2="430" stroke="#64748b" stroke-width="2"/>
  <line x1="745" y1="405" x2="745" y2="430" stroke="#64748b" stroke-width="2"/>

  <!-- Nodes -->
  <!-- document (root) -->
  <rect x="345" y="90" width="110" height="35" rx="8" ry="8" fill="#10b981" fill-opacity="0.20" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">document</text>

  <!-- html -->
  <rect x="350" y="158" width="100" height="37" rx="8" ry="8" fill="#0ea5e9" fill-opacity="0.20" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">&lt;html&gt;</text>

  <!-- head -->
  <rect x="175" y="245" width="90" height="40" rx="8" ry="8" fill="#8b5cf6" fill-opacity="0.20" stroke="#8b5cf6" stroke-width="2"/>
  <text x="220" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">&lt;head&gt;</text>

  <!-- body -->
  <rect x="535" y="245" width="90" height="40" rx="8" ry="8" fill="#8b5cf6" fill-opacity="0.20" stroke="#8b5cf6" stroke-width="2"/>
  <text x="580" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">&lt;body&gt;</text>

  <!-- title -->
  <rect x="95" y="340" width="90" height="38" rx="8" ry="8" fill="#f59e0b" fill-opacity="0.20" stroke="#f59e0b" stroke-width="2"/>
  <text x="140" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">&lt;title&gt;</text>

  <!-- meta -->
  <rect x="255" y="340" width="90" height="38" rx="8" ry="8" fill="#f59e0b" fill-opacity="0.20" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">&lt;meta&gt;</text>

  <!-- h1 -->
  <rect x="415" y="340" width="90" height="38" rx="8" ry="8" fill="#f59e0b" fill-opacity="0.20" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">&lt;h1&gt;</text>

  <!-- p -->
  <rect x="535" y="340" width="90" height="38" rx="8" ry="8" fill="#f59e0b" fill-opacity="0.20" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">&lt;p&gt;</text>

  <!-- div -->
  <rect x="655" y="340" width="90" height="38" rx="8" ry="8" fill="#f59e0b" fill-opacity="0.20" stroke="#f59e0b" stroke-width="2"/>
  <text x="700" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">&lt;div&gt;</text>

  <!-- p (child of div) -->
  <rect x="595" y="430" width="90" height="38" rx="8" ry="8" fill="#64748b" fill-opacity="0.20" stroke="#64748b" stroke-width="2"/>
  <text x="640" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">&lt;p&gt;</text>

  <!-- img (child of div) -->
  <rect x="700" y="430" width="80" height="38" rx="8" ry="8" fill="#64748b" fill-opacity="0.20" stroke="#64748b" stroke-width="2"/>
  <text x="740" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">&lt;img&gt;</text>

  <!-- Legend panel (top-right) -->
  <g transform="translate(608, 88)">
    <rect x="-8" y="-14" width="178" height="108" rx="6" ry="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="0" y="0" font-size="11" font-weight="700" fill="#334155">Tree levels</text>
    <rect x="0" y="10" width="12" height="12" rx="2" fill="#10b981" fill-opacity="0.4" stroke="#10b981" stroke-width="1.5"/>
    <text x="18" y="20" font-size="11" fill="#64748b">root (document)</text>
    <rect x="0" y="28" width="12" height="12" rx="2" fill="#0ea5e9" fill-opacity="0.4" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="18" y="38" font-size="11" fill="#64748b">document element</text>
    <rect x="0" y="46" width="12" height="12" rx="2" fill="#8b5cf6" fill-opacity="0.4" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="18" y="56" font-size="11" fill="#64748b">section branches</text>
    <rect x="0" y="64" width="12" height="12" rx="2" fill="#f59e0b" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="18" y="74" font-size="11" fill="#64748b">content elements</text>
  </g>

  <!-- Caption at bottom -->
  <text x="400" y="485" text-anchor="middle" font-size="11" fill="#94a3b8">JavaScript traverses this tree with methods like document.querySelector() and element.children.</text>
</svg>
