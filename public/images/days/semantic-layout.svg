<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Background card -->
  <rect x="10" y="10" width="780" height="480" rx="16" ry="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Semantic HTML5 Layout</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#64748b">Structural elements that give meaning to your page</text>

  <!-- Page container outline -->
  <rect x="48" y="84" width="704" height="396" rx="10" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="60" y="100" font-size="10" fill="#94a3b8">page</text>

  <!-- Header -->
  <rect x="60" y="110" width="680" height="50" rx="8" ry="8" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">&lt;header&gt;</text>
  <text x="700" y="128" text-anchor="end" font-size="10" fill="#065f46" opacity="0.75">site banner / logo</text>

  <!-- Nav -->
  <rect x="60" y="170" width="680" height="38" rx="8" ry="8" fill="#0ea5e9" fill-opacity="0.18" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">&lt;nav&gt;</text>
  <text x="700" y="186" text-anchor="end" font-size="10" fill="#075985" opacity="0.75">primary navigation</text>

  <!-- Main wrapper -->
  <rect x="60" y="218" width="500" height="232" rx="8" ry="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2"/>
  <text x="74" y="238" font-size="14" font-weight="700" fill="#92400e">&lt;main&gt;</text>
  <text x="74" y="252" font-size="10" fill="#92400e" opacity="0.75">primary content of the page</text>

  <!-- Article (inside main) -->
  <rect x="80" y="262" width="460" height="86" rx="6" ry="6" fill="#8b5cf6" fill-opacity="0.14" stroke="#8b5cf6" stroke-width="2"/>
  <text x="94" y="284" font-size="13" font-weight="700" fill="#5b21b6">&lt;article&gt;</text>
  <text x="94" y="306" font-size="11" fill="#64748b">Independent, self-contained content</text>
  <text x="94" y="324" font-size="11" fill="#64748b">(a blog post, news story, forum reply)</text>
  <text x="94" y="342" font-size="11" fill="#64748b">— could be syndicated on its own.</text>

  <!-- Section (inside main) -->
  <rect x="80" y="358" width="460" height="84" rx="6" ry="6" fill="#64748b" fill-opacity="0.14" stroke="#64748b" stroke-width="2"/>
  <text x="94" y="380" font-size="13" font-weight="700" fill="#334155">&lt;section&gt;</text>
  <text x="94" y="402" font-size="11" fill="#64748b">Thematic grouping of content,</text>
  <text x="94" y="420" font-size="11" fill="#64748b">typically introduced by a heading.</text>

  <!-- Aside (sidebar) -->
  <rect x="580" y="218" width="160" height="232" rx="8" ry="8" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="2"/>
  <text x="660" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">&lt;aside&gt;</text>
  <text x="660" y="266" text-anchor="middle" font-size="11" fill="#5b21b6" opacity="0.85">sidebar</text>
  <line x1="600" y1="282" x2="720" y2="282" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="660" y="305" text-anchor="middle" font-size="10" fill="#64748b">related links</text>
  <text x="660" y="325" text-anchor="middle" font-size="10" fill="#64748b">ads</text>
  <text x="660" y="345" text-anchor="middle" font-size="10" fill="#64748b">archives</text>
  <text x="660" y="365" text-anchor="middle" font-size="10" fill="#64748b">tags</text>
  <text x="660" y="385" text-anchor="middle" font-size="10" fill="#64748b">bio</text>

  <!-- Footer -->
  <rect x="60" y="458" width="680" height="32" rx="8" ry="8" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="479" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">&lt;footer&gt;</text>
</svg>
