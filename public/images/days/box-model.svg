<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Background card -->
  <rect x="10" y="10" width="680" height="480" rx="16" ry="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="350" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CSS Box Model</text>
  <text x="350" y="66" text-anchor="middle" font-size="13" fill="#64748b">Every HTML element is a set of nested boxes</text>

  <!-- Margin (outer) -->
  <rect x="80" y="100" width="540" height="320" rx="8" ry="8" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="98" y="125" font-size="14" font-weight="700" fill="#334155">margin</text>
  <text x="98" y="142" font-size="11" fill="#64748b">transparent space outside the border</text>

  <!-- Border band (filled, sits between margin and padding) -->
  <rect x="130" y="150" width="440" height="220" rx="6" ry="6" fill="#f59e0b" fill-opacity="0.40"/>
  <text x="148" y="175" font-size="14" font-weight="700" fill="#7c2d12">border</text>

  <!-- Padding (sits inside border) -->
  <rect x="160" y="180" width="380" height="160" rx="4" ry="4" fill="#0ea5e9" fill-opacity="0.30" stroke="#0ea5e9" stroke-width="2"/>
  <text x="178" y="203" font-size="14" font-weight="700" fill="#0c4a6e">padding</text>
  <text x="178" y="220" font-size="11" fill="#0c4a6e" opacity="0.85">space inside the border, outside content</text>

  <!-- Content (center) -->
  <rect x="210" y="210" width="280" height="100" rx="4" ry="4" fill="#10b981" fill-opacity="0.30" stroke="#10b981" stroke-width="2"/>
  <text x="350" y="255" text-anchor="middle" font-size="18" font-weight="700" fill="#064e3b">content</text>
  <text x="350" y="278" text-anchor="middle" font-size="12" fill="#065f46" font-family="ui-monospace, 'SF Mono', monospace">width × height</text>

  <!-- Dimension annotations -->
  <!-- Width bracket below content -->
  <line x1="210" y1="325" x2="210" y2="338" stroke="#10b981" stroke-width="1.5"/>
  <line x1="490" y1="325" x2="490" y2="338" stroke="#10b981" stroke-width="1.5"/>
  <line x1="210" y1="335" x2="490" y2="335" stroke="#10b981" stroke-width="1.5"/>
  <text x="350" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">content width</text>

  <!-- Padding thickness indicator (right side) -->
  <line x1="545" y1="210" x2="555" y2="210" stroke="#0ea5e9" stroke-width="1.5"/>
  <line x1="545" y1="310" x2="555" y2="310" stroke="#0ea5e9" stroke-width="1.5"/>
  <line x1="550" y1="210" x2="550" y2="310" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="565" y="263" font-size="10" font-weight="600" fill="#0c4a6e">pad</text>

  <!-- Legend at bottom -->
  <g transform="translate(110, 445)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#64748b" fill-opacity="0.5" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="22" y="12" font-size="12" fill="#334155">margin</text>

    <rect x="110" y="0" width="14" height="14" rx="2" fill="#f59e0b" fill-opacity="0.7"/>
    <text x="132" y="12" font-size="12" fill="#334155">border</text>

    <rect x="220" y="0" width="14" height="14" rx="2" fill="#0ea5e9" fill-opacity="0.5" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="242" y="12" font-size="12" fill="#334155">padding</text>

    <rect x="340" y="0" width="14" height="14" rx="2" fill="#10b981" fill-opacity="0.5" stroke="#10b981" stroke-width="1.5"/>
    <text x="362" y="12" font-size="12" fill="#334155">content</text>
  </g>
</svg>
