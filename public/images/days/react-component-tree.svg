<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="rct-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background card -->
  <rect x="10" y="10" width="780" height="480" rx="16" ry="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">React Component Tree</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#64748b">Components nest as a tree — props flow downward</text>

  <!-- Tree composition connectors (slate solid lines) -->
  <!-- App → bus -->
  <line x1="400" y1="135" x2="400" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="160" y1="160" x2="640" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="160" y1="160" x2="160" y2="195" stroke="#64748b" stroke-width="2"/>
  <line x1="400" y1="160" x2="400" y2="195" stroke="#64748b" stroke-width="2"/>
  <line x1="640" y1="160" x2="640" y2="195" stroke="#64748b" stroke-width="2"/>

  <!-- Main → bus -->
  <line x1="400" y1="235" x2="400" y2="260" stroke="#64748b" stroke-width="2"/>
  <line x1="220" y1="260" x2="580" y2="260" stroke="#64748b" stroke-width="2"/>
  <line x1="220" y1="260" x2="220" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="400" y1="260" x2="400" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="580" y1="260" x2="580" y2="300" stroke="#64748b" stroke-width="2"/>

  <!-- Props flow arrows (violet dashed) -->
  <!-- App → Header -->
  <line x1="200" y1="138" x2="200" y2="192" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#rct-arrow)"/>
  <text x="208" y="170" font-size="10" font-style="italic" fill="#5b21b6">title</text>

  <!-- App → Main -->
  <line x1="440" y1="138" x2="440" y2="192" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#rct-arrow)"/>
  <text x="448" y="170" font-size="10" font-style="italic" fill="#5b21b6">user</text>

  <!-- App → Footer -->
  <line x1="680" y1="138" x2="680" y2="192" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#rct-arrow)"/>
  <text x="688" y="170" font-size="10" font-style="italic" fill="#5b21b6">year</text>

  <!-- Main → Card 1 -->
  <line x1="255" y1="238" x2="255" y2="297" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#rct-arrow)"/>
  <text x="263" y="270" font-size="10" font-style="italic" fill="#5b21b6">item</text>

  <!-- Main → Card 2 -->
  <line x1="435" y1="238" x2="435" y2="297" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#rct-arrow)"/>
  <text x="443" y="270" font-size="10" font-style="italic" fill="#5b21b6">item</text>

  <!-- Main → Card 3 -->
  <line x1="615" y1="238" x2="615" y2="297" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#rct-arrow)"/>
  <text x="623" y="270" font-size="10" font-style="italic" fill="#5b21b6">item</text>

  <!-- App node (root) -->
  <rect x="335" y="95" width="130" height="40" rx="10" ry="10" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">&lt;App /&gt;</text>
  <text x="400" y="148" text-anchor="middle" font-size="9" fill="#065f46" opacity="0.7">root · holds state</text>

  <!-- Header -->
  <rect x="100" y="195" width="120" height="40" rx="10" ry="10" fill="#0ea5e9" fill-opacity="0.22" stroke="#0ea5e9" stroke-width="2"/>
  <text x="160" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">&lt;Header /&gt;</text>

  <!-- Main -->
  <rect x="340" y="195" width="120" height="40" rx="10" ry="10" fill="#0ea5e9" fill-opacity="0.22" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">&lt;Main /&gt;</text>

  <!-- Footer -->
  <rect x="580" y="195" width="120" height="40" rx="10" ry="10" fill="#0ea5e9" fill-opacity="0.22" stroke="#0ea5e9" stroke-width="2"/>
  <text x="640" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">&lt;Footer /&gt;</text>

  <!-- Cards (children of Main) -->
  <rect x="170" y="300" width="100" height="40" rx="10" ry="10" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-width="2"/>
  <text x="220" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">&lt;Card /&gt;</text>

  <rect x="350" y="300" width="100" height="40" rx="10" ry="10" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">&lt;Card /&gt;</text>

  <rect x="530" y="300" width="100" height="40" rx="10" ry="10" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">&lt;Card /&gt;</text>

  <!-- Notes panel -->
  <rect x="60" y="372" width="680" height="98" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="396" font-size="13" font-weight="700" fill="#334155">How it works</text>

  <!-- Legend chips -->
  <g transform="translate(540, 384)">
    <line x1="0" y1="6" x2="22" y2="6" stroke="#64748b" stroke-width="2"/>
    <text x="28" y="10" font-size="11" fill="#334155">composition</text>
    <line x1="120" y1="6" x2="142" y2="6" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="148" y="10" font-size="11" fill="#334155">props flow</text>
  </g>

  <text x="80" y="418" font-size="12" fill="#64748b">• Solid lines show composition: a parent renders its children.</text>
  <text x="80" y="436" font-size="12" fill="#64748b">• Dashed violet arrows show props flowing from parent to child.</text>
  <text x="80" y="454" font-size="12" fill="#64748b">• State lives in &lt;App&gt;; data is passed down as props to leaf components.</text>
</svg>
