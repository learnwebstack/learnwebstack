<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="cs-arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="cs-arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/>
    </marker>
    <marker id="cs-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background card -->
  <rect x="10" y="10" width="780" height="380" rx="16" ry="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Client-Server Architecture</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#64748b">How browsers and servers communicate over HTTP</text>

  <!-- DNS Resolution step (top, centered) -->
  <g>
    <rect x="250" y="88" width="300" height="56" rx="10" ry="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="272" cy="116" r="11" fill="#f59e0b"/>
    <text x="272" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <text x="293" y="110" font-size="12" font-weight="700" fill="#92400e">DNS Resolution</text>
    <text x="293" y="128" font-size="11" fill="#78350f" font-family="ui-monospace, 'SF Mono', monospace">example.com → 93.184.216.34</text>
  </g>

  <!-- Connector from DNS step down to the flow -->
  <line x1="400" y1="144" x2="400" y2="160" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="408" y="158" font-size="10" fill="#92400e">resolves</text>

  <!-- Client (Browser) -->
  <g>
    <rect x="80" y="195" width="180" height="135" rx="12" ry="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <!-- Browser window mock -->
    <rect x="105" y="215" width="130" height="90" rx="6" ry="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="105" y="215" width="130" height="20" rx="6" ry="6" fill="#10b981"/>
    <rect x="105" y="229" width="130" height="6" fill="#10b981"/>
    <circle cx="115" cy="225" r="3" fill="#ffffff"/>
    <circle cx="125" cy="225" r="3" fill="#ffffff"/>
    <circle cx="135" cy="225" r="3" fill="#ffffff"/>
    <rect x="115" y="245" width="110" height="10" rx="2" ry="2" fill="#d1fae5"/>
    <rect x="115" y="262" width="80" height="6" rx="2" ry="2" fill="#a7f3d0"/>
    <rect x="115" y="274" width="100" height="6" rx="2" ry="2" fill="#a7f3d0"/>
    <rect x="115" y="286" width="60" height="6" rx="2" ry="2" fill="#a7f3d0"/>
    <text x="170" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Client (Browser)</text>
  </g>

  <!-- Server -->
  <g>
    <rect x="540" y="195" width="180" height="135" rx="12" ry="12" fill="#eff6ff" stroke="#0ea5e9" stroke-width="2"/>
    <!-- Server rack mock -->
    <rect x="585" y="215" width="90" height="22" rx="4" ry="4" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="595" cy="226" r="3" fill="#10b981"/>
    <rect x="608" y="222" width="55" height="8" rx="2" ry="2" fill="#bae6fd"/>
    <rect x="585" y="242" width="90" height="22" rx="4" ry="4" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="595" cy="253" r="3" fill="#10b981"/>
    <rect x="608" y="249" width="55" height="8" rx="2" ry="2" fill="#bae6fd"/>
    <rect x="585" y="269" width="90" height="22" rx="4" ry="4" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="595" cy="280" r="3" fill="#f59e0b"/>
    <rect x="608" y="276" width="55" height="8" rx="2" ry="2" fill="#bae6fd"/>
    <text x="630" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">Server</text>
  </g>

  <!-- Step 2: HTTP Request (left → right, top) -->
  <g>
    <line x1="270" y1="240" x2="528" y2="240" stroke="#10b981" stroke-width="2.5" marker-end="url(#cs-arrow-emerald)"/>
    <rect x="328" y="221" width="144" height="22" rx="6" ry="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="336" y="236" font-size="11" font-weight="700" fill="#065f46">2</text>
    <text x="400" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">HTTP Request →</text>
  </g>

  <!-- Step 3: HTTP Response (right → left, bottom) -->
  <g>
    <line x1="530" y1="290" x2="272" y2="290" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#cs-arrow-sky)"/>
    <rect x="328" y="297" width="144" height="22" rx="6" ry="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="336" y="312" font-size="11" font-weight="700" fill="#075985">3</text>
    <text x="400" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#075985">← HTTP Response</text>
  </g>

  <!-- Footer caption -->
  <text x="400" y="372" text-anchor="middle" font-size="11" fill="#94a3b8">Steps 1–3 repeat for every resource (HTML, CSS, JS, images, data).</text>
</svg>
