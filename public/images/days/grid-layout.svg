<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Background card -->
  <rect x="10" y="10" width="680" height="430" rx="16" ry="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="350" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CSS Grid Layout</text>
  <text x="350" y="66" text-anchor="middle" font-size="13" fill="#64748b">grid-template-columns · grid-template-rows · gap</text>

  <!-- Column headers -->
  <text x="350" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">grid-template-columns: 1fr 1fr 1fr</text>
  <text x="220" y="110" text-anchor="middle" font-size="11" fill="#64748b">col 1 (1fr)</text>
  <text x="350" y="110" text-anchor="middle" font-size="11" fill="#64748b">col 2 (1fr)</text>
  <text x="480" y="110" text-anchor="middle" font-size="11" fill="#64748b">col 3 (1fr)</text>

  <!-- Vertical bracket arrows for columns -->
  <line x1="160" y1="100" x2="280" y2="100" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="290" y1="100" x2="410" y2="100" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="420" y1="100" x2="540" y2="100" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Row labels (left side) -->
  <text x="140" y="200" text-anchor="end" font-size="12" font-weight="700" fill="#075985">row 1</text>
  <text x="140" y="215" text-anchor="end" font-size="11" fill="#64748b">120px</text>
  <text x="140" y="340" text-anchor="end" font-size="12" font-weight="700" fill="#075985">row 2</text>
  <text x="140" y="355" text-anchor="end" font-size="11" fill="#64748b">120px</text>

  <!-- Vertical "grid-template-rows" label -->
  <text x="60" y="255" text-anchor="middle" font-size="11" font-weight="600" fill="#075985" transform="rotate(-90, 60, 255)">grid-template-rows</text>

  <!-- Grid container -->
  <rect x="150" y="120" width="400" height="270" rx="8" ry="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="160" y="138" font-size="10" fill="#94a3b8" font-style="italic">display: grid</text>

  <!-- Row 1 -->
  <rect x="160" y="150" width="120" height="120" rx="6" ry="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="2"/>
  <text x="220" y="200" text-anchor="middle" font-size="11" fill="#065f46" opacity="0.75">grid-area</text>
  <text x="220" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">1</text>

  <rect x="290" y="150" width="120" height="120" rx="6" ry="6" fill="#0ea5e9" fill-opacity="0.18" stroke="#0ea5e9" stroke-width="2"/>
  <text x="350" y="200" text-anchor="middle" font-size="11" fill="#075985" opacity="0.75">grid-area</text>
  <text x="350" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">2</text>

  <rect x="420" y="150" width="120" height="120" rx="6" ry="6" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="2"/>
  <text x="480" y="200" text-anchor="middle" font-size="11" fill="#5b21b6" opacity="0.75">grid-area</text>
  <text x="480" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">3</text>

  <!-- Row 2 -->
  <rect x="160" y="280" width="120" height="100" rx="6" ry="6" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="2"/>
  <text x="220" y="325" text-anchor="middle" font-size="11" fill="#92400e" opacity="0.75">grid-area</text>
  <text x="220" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">4</text>

  <rect x="290" y="280" width="120" height="100" rx="6" ry="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="2"/>
  <text x="350" y="325" text-anchor="middle" font-size="11" fill="#065f46" opacity="0.75">grid-area</text>
  <text x="350" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">5</text>

  <rect x="420" y="280" width="120" height="100" rx="6" ry="6" fill="#0ea5e9" fill-opacity="0.18" stroke="#0ea5e9" stroke-width="2"/>
  <text x="480" y="325" text-anchor="middle" font-size="11" fill="#075985" opacity="0.75">grid-area</text>
  <text x="480" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">6</text>

  <!-- Gap indicators -->
  <!-- Column gap -->
  <line x1="285" y1="150" x2="285" y2="380" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="282" y1="385" x2="288" y2="385" stroke="#f59e0b" stroke-width="1"/>
  <line x1="282" y1="395" x2="288" y2="395" stroke="#f59e0b" stroke-width="1"/>
  <line x1="285" y1="385" x2="285" y2="395" stroke="#f59e0b" stroke-width="1"/>
  <text x="285" y="408" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">gap</text>

  <!-- Row gap -->
  <line x1="160" y1="275" x2="540" y2="275" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="545" y1="272" x2="555" y2="272" stroke="#f59e0b" stroke-width="1"/>
  <line x1="545" y1="278" x2="555" y2="278" stroke="#f59e0b" stroke-width="1"/>
  <line x1="555" y1="272" x2="555" y2="278" stroke="#f59e0b" stroke-width="1"/>
  <text x="570" y="278" font-size="10" font-weight="600" fill="#92400e">gap</text>

  <!-- Side notes -->
  <text x="565" y="155" font-size="11" font-weight="600" fill="#64748b">grid items</text>
  <text x="565" y="170" font-size="11" fill="#64748b">placed in</text>
  <text x="565" y="185" font-size="11" fill="#64748b">cells 1–6</text>

  <!-- Caption -->
  <text x="350" y="425" text-anchor="middle" font-size="11" fill="#94a3b8">grid-template-columns: repeat(3, 1fr); grid-template-rows: 120px 120px; gap: 10px;</text>
</svg>
